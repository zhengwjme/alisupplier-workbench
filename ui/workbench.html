<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AliSupplier · 外贸随身助手</title>
  <link rel="stylesheet" href="/workbench.css">
  <script src="/workbench.js" defer></script>
</head>
<body>
<div class="shell">
  <aside class="navigation">
    <div class="identity">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span></div>
      <div><strong>AliSupplier</strong><small>外贸随身助手</small></div>
    </div>
    <nav aria-label="工作台">
      <button class="nav-button active" data-screen="work">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>跟进</span>
      </button>
      <button class="nav-button" data-screen="analytics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 3"/></svg>
        <span>选品统计</span>
      </button>
      <button class="nav-button" data-screen="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09c-.66 0-1.25.4-1.51 1z"/></svg>
        <span>设置</span>
      </button>
    </nav>
    <div class="nav-bottom">
      <p class="connection" id="connection"><span></span>正在连接</p>
      <a href="/logs">采集日志 ↗</a>
    </div>
  </aside>

  <header class="app-topbar">
    <div class="topbar-left">
      <span class="topbar-title" id="topbar-title">AliSupplier</span>
    </div>
    <div class="topbar-actions">
      <button id="frida-toggle" type="button" class="pill-btn" title="启用后，在阿里卖家点击买家时自动同步打开聊天详情">
        <span class="dot"></span><span class="lbl">启用集成</span>
      </button>
      <button id="pin-toggle" type="button" class="circle-btn" hidden title="窗口置顶悬浮" aria-label="置顶">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
      </button>
      <button id="widget-toggle" type="button" class="circle-btn" hidden title="切换大窗 / 迷你悬浮窗" aria-label="切换窗口大小">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </button>
      <button id="desktop-control" type="button" class="circle-btn" hidden title="服务控制" aria-label="服务控制">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </button>
      <select id="accounts" aria-label="卖家账号"><option value="">全部账号</option></select>
    </div>
  </header>

  <main class="main">
    <section id="work-screen" aria-label="跟进工作台">
      <div class="editorial-hero">
        <div class="hero-copy">
          <div class="hero-kicker">TRADE DESK · <span id="today"></span></div>
          <h1>今日跟进<span class="accent-dot">.</span></h1>
        </div>
        <div class="hero-art-wrap ai-hero-stage" aria-label="AI 全球询盘与选品智能引擎">
          <svg class="ai-hero-svg" viewBox="0 0 640 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
            <defs>
              <linearGradient id="heroBg" x1="0" y1="0" x2="640" y2="240" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#f6f4ee"/>
                <stop offset="52%" stop-color="#eef1f9"/>
                <stop offset="100%" stop-color="#f6efe9"/>
              </linearGradient>
              <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#233478" stop-opacity="0.22"/>
                <stop offset="55%" stop-color="#a4562e" stop-opacity="0.08"/>
                <stop offset="100%" stop-color="#233478" stop-opacity="0"/>
              </radialGradient>
              <linearGradient id="beamIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#233478" stop-opacity="0"/>
                <stop offset="50%" stop-color="#233478" stop-opacity="0.95"/>
                <stop offset="100%" stop-color="#5b74d4" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="beamCopper" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#a4562e" stop-opacity="0"/>
                <stop offset="50%" stop-color="#a4562e" stop-opacity="0.95"/>
                <stop offset="100%" stop-color="#d4895d" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="coreFill" x1="278" y1="78" x2="362" y2="162" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#2a3e8f"/>
                <stop offset="100%" stop-color="#1b2541"/>
              </linearGradient>
              <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
                <circle cx="2" cy="2" r="1.15" fill="#233478" fill-opacity="0.14"/>
              </pattern>
            </defs>

            <!-- 柔和渐变底 + 精密经纬点阵 -->
            <rect width="640" height="240" fill="url(#heroBg)"/>
            <rect width="640" height="240" fill="url(#dotGrid)"/>
            <circle cx="320" cy="120" r="128" fill="url(#coreGlow)"/>

            <!-- 左侧全球买家节点到中央 AI 核心的贝塞尔航线（底轨 + 流光脉冲） -->
            <g class="hero-routes">
              <path d="M 74 58 C 155 48, 206 96, 282 114" stroke="#233478" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="4 5"/>
              <path d="M 52 126 C 138 128, 198 122, 278 120" stroke="#a4562e" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="4 5"/>
              <path d="M 96 188 C 174 188, 218 144, 284 128" stroke="#5c7d6d" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="4 5"/>

              <path class="ai-beam beam-1" pathLength="100" d="M 74 58 C 155 48, 206 96, 282 114" stroke="url(#beamIndigo)" stroke-width="2.4" stroke-linecap="round"/>
              <path class="ai-beam beam-2" pathLength="100" d="M 52 126 C 138 128, 198 122, 278 120" stroke="url(#beamCopper)" stroke-width="2.4" stroke-linecap="round"/>
              <path class="ai-beam beam-3" pathLength="100" d="M 96 188 C 174 188, 218 144, 284 128" stroke="url(#beamIndigo)" stroke-width="2.2" stroke-linecap="round"/>
            </g>

            <!-- 左侧全球买家发光节点（带错峰脉冲） -->
            <g class="hero-nodes">
              <circle class="node-pulse p1" cx="74" cy="58" r="14" stroke="#233478" stroke-width="1.4"/>
              <circle cx="74" cy="58" r="5.5" fill="#233478"/>
              <circle cx="74" cy="58" r="2.2" fill="#ffffff"/>

              <circle class="node-pulse p2" cx="52" cy="126" r="16" stroke="#a4562e" stroke-width="1.4"/>
              <circle cx="52" cy="126" r="6" fill="#a4562e"/>
              <circle cx="52" cy="126" r="2.2" fill="#ffffff"/>

              <circle class="node-pulse p3" cx="96" cy="188" r="14" stroke="#5c7d6d" stroke-width="1.4"/>
              <circle cx="96" cy="188" r="5.5" fill="#5c7d6d"/>
              <circle cx="96" cy="188" r="2.2" fill="#ffffff"/>

              <!-- 辅助微小装饰节点 -->
              <circle cx="152" cy="84" r="3" fill="#233478" fill-opacity="0.35"/>
              <circle cx="170" cy="166" r="3" fill="#a4562e" fill-opacity="0.38"/>
            </g>

            <!-- 右侧 AI 输出信号连线（中心核心 → 3 张结构化微卡） -->
            <g class="hero-outputs">
              <path d="M 362 110 C 412 96, 430 62, 468 62" stroke="#233478" stroke-opacity="0.2" stroke-width="1.5"/>
              <path d="M 364 120 L 468 120" stroke="#a4562e" stroke-opacity="0.22" stroke-width="1.5"/>
              <path d="M 362 130 C 412 144, 430 178, 468 178" stroke="#5c7d6d" stroke-opacity="0.24" stroke-width="1.5"/>

              <path class="ai-beam beam-out-1" pathLength="100" d="M 362 110 C 412 96, 430 62, 468 62" stroke="#233478" stroke-width="2.2" stroke-linecap="round"/>
              <path class="ai-beam beam-out-2" pathLength="100" d="M 364 120 L 468 120" stroke="#a4562e" stroke-width="2.2" stroke-linecap="round"/>
              <path class="ai-beam beam-out-3" pathLength="100" d="M 362 130 C 412 144, 430 178, 468 178" stroke="#5c7d6d" stroke-width="2.2" stroke-linecap="round"/>
            </g>

            <!-- 中央 AI 智能引擎核心（双层反向旋转精密刻度环 + 雷达波 + 四芒星） -->
            <g class="hero-core">
              <circle class="radar-wave w1" cx="320" cy="120" r="46" stroke="#233478" stroke-width="1.3"/>
              <circle class="radar-wave w2" cx="320" cy="120" r="46" stroke="#a4562e" stroke-width="1.1"/>

              <g class="orbit-outer">
                <circle cx="320" cy="120" r="68" stroke="#233478" stroke-opacity="0.26" stroke-width="1.4" stroke-dasharray="6 8"/>
                <path d="M 272 72 A 68 68 0 0 1 368 72" stroke="#233478" stroke-width="2.6" stroke-linecap="round"/>
                <circle cx="368" cy="72" r="3.5" fill="#233478"/>
              </g>

              <g class="orbit-inner">
                <circle cx="320" cy="120" r="52" stroke="#a4562e" stroke-opacity="0.24" stroke-width="1.2" stroke-dasharray="3 6"/>
                <path d="M 357 157 A 52 52 0 0 1 283 157" stroke="#a4562e" stroke-width="2.6" stroke-linecap="round"/>
                <circle cx="283" cy="157" r="3.2" fill="#a4562e"/>
              </g>

              <!-- 深午夜靛蓝核心圆徽 -->
              <circle cx="320" cy="120" r="35" fill="url(#coreFill)"/>
              <circle cx="320" cy="120" r="34.2" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.2"/>

              <!-- AI 四芒星呼吸火花 -->
              <g class="core-spark">
                <path d="M 320 100 L 325.2 114.8 L 340 120 L 325.2 125.2 L 320 140 L 314.8 125.2 L 300 120 L 314.8 114.8 Z" fill="#fafaf7"/>
                <circle cx="337" cy="103" r="2.4" fill="#e6a67c"/>
              </g>
            </g>

            <!-- 右侧 3 张悬浮 AI 洞察微卡（纯几何高级感，任意尺寸高清） -->
            <g class="hero-card hc-1">
              <rect x="468" y="42" width="132" height="40" rx="11" fill="#ffffff" fill-opacity="0.92" stroke="#e9e6de" stroke-width="1.2"/>
              <circle cx="486" cy="62" r="5" fill="#233478"/>
              <rect x="499" y="54" width="66" height="6" rx="3" fill="#1b2541" fill-opacity="0.78"/>
              <rect x="499" y="65" width="44" height="5" rx="2.5" fill="#233478" fill-opacity="0.22"/>
              <rect class="card-bar cb-1" x="499" y="65" width="32" height="5" rx="2.5" fill="#233478"/>
            </g>

            <g class="hero-card hc-2">
              <rect x="468" y="100" width="132" height="40" rx="11" fill="#ffffff" fill-opacity="0.92" stroke="#e9e6de" stroke-width="1.2"/>
              <circle cx="486" cy="120" r="5" fill="#a4562e"/>
              <rect x="499" y="112" width="76" height="6" rx="3" fill="#1b2541" fill-opacity="0.78"/>
              <rect x="499" y="123" width="54" height="5" rx="2.5" fill="#a4562e" fill-opacity="0.2"/>
              <rect class="card-bar cb-2" x="499" y="123" width="40" height="5" rx="2.5" fill="#a4562e"/>
            </g>

            <g class="hero-card hc-3">
              <rect x="468" y="158" width="132" height="40" rx="11" fill="#ffffff" fill-opacity="0.92" stroke="#e9e6de" stroke-width="1.2"/>
              <circle cx="486" cy="178" r="5" fill="#5c7d6d"/>
              <rect x="499" y="170" width="58" height="6" rx="3" fill="#1b2541" fill-opacity="0.78"/>
              <rect x="499" y="181" width="48" height="5" rx="2.5" fill="#5c7d6d" fill-opacity="0.22"/>
              <path d="M 576 178 L 580 182 L 588 173" stroke="#5c7d6d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </svg>
        </div>
      </div>

      <div class="system-note" id="system-note" hidden></div>

      <div class="toolbar">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="search" type="search" placeholder="搜索买家姓名、UID 或询盘内容" aria-label="搜索客户或商品">
        </div>
        <div class="tabs" aria-label="筛选会话">
          <button data-filter="unreplied">待回复</button>
          <button data-filter="silent">待唤醒</button>
          <button data-filter="follow" class="active">待跟进</button>
          <button data-filter="recent">最近更新</button>
          <button data-filter="review">需核对</button>
          <button data-filter="all">全部</button>
        </div>
      </div>

      <div class="list-section-head">
        <span>客户会话</span>
        <span class="list-count" id="list-count"></span>
      </div>
      <div id="list" class="thread-list" aria-live="polite"><div class="empty">正在读取会话…</div></div>
      <button id="more" class="button more" hidden>加载更多</button>
    </section>

    <section id="analytics-screen" hidden aria-label="选品与数据统计">
      <div class="analytics-header">
        <div>
          <div class="hero-kicker">SOURCING INSIGHTS</div>
          <h1>选品与地域<span class="accent-dot">.</span></h1>
        </div>
        <select id="analytics-days" aria-label="统计周期">
          <option value="7">近 7 天</option>
          <option value="30" selected>近 30 天</option>
          <option value="0">全部历史</option>
        </select>
      </div>
      <div id="analytics-body"><div class="empty">正在统计本地数据…</div></div>
    </section>

    <section id="settings-screen" hidden aria-label="AI 与设置">
      <div class="analytics-header">
        <div>
          <div class="hero-kicker">PREFERENCES</div>
          <h1>AI 与设置<span class="accent-dot">.</span></h1>
        </div>
        <button id="save" class="button primary" form="settings-form" disabled>保存</button>
      </div>
      <form id="settings-form">
        <fieldset id="settings-fields" disabled>
        <div class="setting-group">
          <h2>汇总时机</h2>
          <label class="check"><input type="checkbox" id="automatic"> 有客户新消息时自动汇总</label>
          <div class="form-grid">
            <label>静默等待（分钟）<input id="quiet_minutes" type="number" min="1" max="60" required></label>
            <label>最长等待（分钟）<input id="max_minutes" type="number" min="1" max="120" required></label>
          </div>
        </div>
        <div class="setting-group">
          <div class="section-title"><h2>AI 模型接口</h2><button type="button" class="button" id="add-profile">添加接口</button></div>
          <div id="profiles"></div>
          <div class="form-grid">
            <label>文字汇总与回复<select id="text_profile"></select></label>
            <label>看图模型<select id="image_profile"></select></label>
          </div>
        </div>
        <div class="setting-group">
          <h2>图片与每日预算</h2>
          <label class="check"><input type="checkbox" id="ocr"> 本地 OCR 提取文字 <span id="ocr-status" class="muted"></span></label>
          <label class="check"><input type="checkbox" id="vision"> 启用看图模型识别附件</label>
          <label class="check"><input type="checkbox" id="allow_external_images"> 允许把待识别图片发送到外部接口</label>
          <div class="form-grid">
            <label>每日文字 Token 预算<input id="token_budget" type="number" min="0" max="100000000" required></label>
            <label>每日看图次数上限<input id="image_budget" type="number" min="0" max="10000" required></label>
          </div>
          <p class="muted" id="usage"></p>
        </div>
        </fieldset>
      </form>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="底部导航">
    <button class="bottom-tab active" data-screen="work">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>跟进</span>
    </button>
    <button class="bottom-tab" data-screen="analytics">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 3"/></svg>
      <span>选品</span>
    </button>
    <button class="bottom-tab" data-screen="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09c-.66 0-1.25.4-1.51 1z"/></svg>
      <span>设置</span>
    </button>
  </nav>
</div>

<dialog id="detail" class="detail">
  <header class="detail-head">
    <button id="close-detail" class="circle-btn" type="button" aria-label="返回" title="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="detail-head-info">
      <h2 id="detail-title">客户详情</h2>
      <div class="detail-head-sub" id="detail-account"></div>
    </div>
    <div class="detail-head-actions">
      <button id="detail-chat-btn" class="head-chat-btn" type="button" title="查看完整聊天记录">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>聊天</span>
      </button>
      <button id="detail-run-btn" class="circle-btn" type="button" aria-label="立即汇总" title="立即用 AI 汇总本会话">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/></svg>
      </button>
      <button id="detail-refresh-btn" class="circle-btn" type="button" aria-label="刷新详情" title="刷新会话详情">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
    </div>
  </header>
  <div class="detail-scroll" id="detail-scroll"></div>
  <div class="detail-composer" id="detail-composer"></div>
</dialog>
<dialog id="buyer-drill" class="drill-dialog">
  <header class="drill-head">
    <div class="drill-head-info">
