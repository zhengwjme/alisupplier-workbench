<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>客户跟进 · AliSupplier</title>
  <link rel="stylesheet" href="/workbench.css">
  <script src="/workbench.js" defer></script>
</head>
<body>
<div class="shell">
  <aside class="navigation">
    <div class="identity">
      <div class="brand-dot" aria-hidden="true"></div>
      <div><strong>客户跟进</strong><small>AliSupplier</small></div>
    </div>
    <nav aria-label="工作台">
      <button class="nav-button active" data-screen="work">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>跟进工作台</span>
      </button>
      <button class="nav-button" data-screen="analytics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
        <span>选品与统计</span>
      </button>
      <button class="nav-button" data-screen="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09c-.66 0-1.25.4-1.51 1z"/></svg>
        <span>AI 与设置</span>
      </button>
    </nav>
    <div class="nav-bottom">
      <p class="connection" id="connection"><span></span>正在连接</p>
      <a href="/logs">采集调试 ↗</a>
    </div>
  </aside>

  <header class="app-topbar">
    <div class="topbar-left">
      <span class="topbar-title" id="topbar-title">客户跟进</span>
      <span class="topbar-date" id="today"></span>
    </div>
    <div class="topbar-actions">
      <button id="frida-toggle" type="button" class="pill-btn" title="启用后，在阿里卖家点击买家时自动同步打开聊天详情">
        <span class="dot"></span><span class="lbl">启用集成</span>
      </button>
      <button id="pin-toggle" type="button" class="icon-btn" hidden title="窗口置顶悬浮" aria-label="置顶">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
      </button>
      <button id="widget-toggle" type="button" class="icon-btn" hidden title="切换迷你悬浮窗 / 展开大窗" aria-label="切换窗口大小">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </button>
      <button id="desktop-control" type="button" class="icon-btn" hidden title="服务控制" aria-label="服务控制">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </button>
      <select id="accounts" aria-label="卖家账号"><option value="">全部账号</option></select>
    </div>
  </header>

  <main class="main">
    <section id="work-screen" aria-label="跟进工作台">
      <div class="system-note" id="system-note" hidden></div>
      <div class="toolbar">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="search" type="search" placeholder="搜索客户名、UID 或聊天内容" aria-label="搜索客户或商品">
        </div>
        <div class="tabs" aria-label="筛选会话">
          <button data-filter="unreplied">待回复</button>
          <button data-filter="silent">待唤醒</button>
          <button data-filter="follow" class="active">待跟进</button>
          <button data-filter="recent">最近更新</button>
          <button data-filter="review">需核对</button>
          <button data-filter="all">全部</button>
        </div>
      </div>
      <div id="list" class="thread-list" aria-live="polite"><div class="empty">正在读取会话…</div></div>
      <button id="more" class="button more" hidden>加载更多</button>
    </section>

    <section id="analytics-screen" hidden aria-label="选品与数据统计">
      <div class="section-bar">
        <div class="section-bar-left">
          <select id="analytics-days" aria-label="统计周期">
            <option value="7">近 7 天</option>
            <option value="30" selected>近 30 天</option>
            <option value="0">全部历史</option>
          </select>
          <button id="analytics-refresh" type="button" class="button">刷新</button>
        </div>
        <button id="export-csv" type="button" class="button primary">导出 CSV</button>
      </div>
      <div id="analytics-body"><div class="empty">正在统计本地数据…</div></div>
    </section>

    <section id="settings-screen" hidden aria-label="AI 与设置">
      <div class="section-bar">
        <strong>AI 模型与汇总设置</strong>
        <button id="save" class="button primary" form="settings-form" disabled>保存设置</button>
      </div>
      <form id="settings-form">
        <fieldset id="settings-fields" disabled>
        <div class="setting-section">
          <h2>汇总时机</h2>
          <label class="check"><input type="checkbox" id="automatic"> 有客户新消息时自动汇总</label>
          <div class="form-grid">
            <label>静默等待（分钟）<input id="quiet_minutes" type="number" min="1" max="60" required></label>
            <label>最长等待（分钟）<input id="max_minutes" type="number" min="1" max="120" required></label>
          </div>
        </div>
        <div class="setting-section">
          <div class="section-title"><h2>AI 接口</h2><button type="button" class="button" id="add-profile">添加接口</button></div>
          <div id="profiles"></div>
          <div class="form-grid">
            <label>文字汇总<select id="text_profile"></select></label>
            <label>看图模型<select id="image_profile"></select></label>
          </div>
        </div>
        <div class="setting-section">
          <h2>图片和用量</h2>
          <label class="check"><input type="checkbox" id="ocr"> 本地 OCR 提取文字 <span id="ocr-status" class="muted"></span></label>
          <label class="check"><input type="checkbox" id="vision"> 在本批有可用图片时启用看图模型</label>
          <label class="check"><input type="checkbox" id="allow_external_images"> 允许把待识别图片发送到外部接口</label>
          <div class="form-grid">
            <label>每日文字 Token 预算<input id="token_budget" type="number" min="0" max="100000000" required></label>
            <label>每日看图次数上限<input id="image_budget" type="number" min="0" max="10000" required></label>
          </div>
          <p class="muted" id="usage"></p>
        </div>
        </fieldset>
      </form>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="底部导航">
    <button class="bottom-tab active" data-screen="work">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>跟进</span>
    </button>
    <button class="bottom-tab" data-screen="analytics">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
      <span>选品统计</span>
    </button>
    <button class="bottom-tab" data-screen="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09c-.66 0-1.25.4-1.51 1z"/></svg>
      <span>设置</span>
    </button>
  </nav>
</div>

<dialog id="detail" class="detail">
  <header class="detail-head">
    <button id="close-detail" class="icon-btn" type="button" aria-label="返回列表" title="返回列表">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="detail-head-info">
      <h2 id="detail-title">客户详情</h2>
      <div class="detail-head-sub" id="detail-account"></div>
    </div>
  </header>
  <div class="detail-scroll" id="detail-scroll"></div>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
